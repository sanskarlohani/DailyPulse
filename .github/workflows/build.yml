name: Build iOS App

on:
  push:
    branches: [ "main", "test" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Validate DailyPulse
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Verify Xcode & Swift Version
        run: |
          xcodebuild -version
          swift --version

      - name: Compile Application (xcodebuild)
        run: |
          xcodebuild -project DailyPulse.xcodeproj \
                     -scheme DailyPulse \
                     -sdk iphonesimulator \
                     -destination 'generic/platform=iOS Simulator' \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     -quiet build
